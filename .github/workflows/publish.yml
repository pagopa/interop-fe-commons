name: Publish

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ['main']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm publish --provenance --access public --tag latest

  publish-rc:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && contains(format(',{0},', vars.AUTHORIZED_RC_PUBLISHERS), format(',{0},', github.actor))
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Publish RC release from branch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-RC[0-9]+$ ]]; then
            echo "RC publish requires version format 1.2.3-RC1. Current version: $VERSION"
            exit 1
          fi
          npm publish --provenance --access public --tag rc
